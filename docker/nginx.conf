map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

map $http_host $forwarded_port {
    ~*^.*:(?<p>\d+)$ $p;
    default 80;
}

server {
    listen 80;
    server_name _;

    # Use Docker embedded DNS resolver for dynamic service discovery
    resolver 127.0.0.11 valid=10s ipv6=off;

    client_max_body_size 50M;

    # Proxy WebSocket VNC traffic to the websockify bridge container
    location /websockify {
        set $bridge_upstream http://bridge:6080;
        proxy_pass $bridge_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Proxy HTTP application traffic to the Laravel app container
    location / {
        set $app_upstream http://app:8000;
        proxy_pass $app_upstream;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $forwarded_port;
        proxy_read_timeout 60s;
        proxy_connect_timeout 60s;
    }
}
