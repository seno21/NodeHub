name: nodehub

services:
  nodehub:
    build: .
    image: nodehub:latest
    container_name: nodehub
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8000}:443"
    environment:
      APP_ENV: ${NODEHUB_APP_ENV:-production}
      APP_DEBUG: "${NODEHUB_APP_DEBUG:-false}"
      APP_URL: ${NODEHUB_APP_URL:-https://localhost:8000}
      DB_HOST: 127.0.0.1
      DB_PORT: "3306"
      DB_DATABASE: ${NODEHUB_DB_NAME:-nodehub}
      DB_USERNAME: ${NODEHUB_DB_USER:-nodehub}
      DB_PASSWORD: ${NODEHUB_DB_PASSWORD:-nodehub-secret}
      CACHE_STORE: database
      SESSION_DRIVER: database
      QUEUE_CONNECTION: database
      MAIL_MAILER: log
      VNC_WEBSOCKIFY_BINARY: websockify
      VNC_WEBSOCKIFY_LISTEN: 127.0.0.1:6080
      VNC_BRIDGE_CHECK: "false"
      VNC_WS_URL: ${NODEHUB_WS_URL:-}
      VNC_TOKEN_TTL: ${NODEHUB_TOKEN_TTL:-120}
      VNC_STATUS_TIMEOUT: ${NODEHUB_STATUS_TIMEOUT:-1}
      ADMIN_EMAIL: ${NODEHUB_ADMIN_EMAIL:-admin@mail.com}
      ADMIN_NAME: ${NODEHUB_ADMIN_NAME:-Admin}
      ADMIN_PASSWORD: ${NODEHUB_ADMIN_PASSWORD:-qwerty21}
    volumes:
      - nodehub-db:/var/lib/mysql
      - nodehub-storage:/var/www/html/storage

volumes:
  nodehub-db:
  nodehub-storage:
